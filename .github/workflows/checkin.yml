name: Daily Check-In

permissions:
  contents: write

on:
  schedule:
    # 13:00 UTC every day. GitHub Actions cron runs in UTC.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check-in bot
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          INSTRUCTOR_ID: ${{ secrets.INSTRUCTOR_ID }}
        run: python checkin.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkin-data-${{ github.run_id }}
          path: artifact/
          if-no-files-found: warn

      - name: Commit artifact files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifact/
          git diff --cached --quiet && echo "No new artifact files to commit" || git commit -m "Add check-in data for $(date -u +%Y-%m-%d)"
          git push
